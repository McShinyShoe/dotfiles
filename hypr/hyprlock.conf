# ~/.config/hypr/hyprlock.conf

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    path = ~/Pictures/Background/desktop/dark-forest.jpg
    blur_passes = 2
    blur_size = 7
    brightness = 0.6
    contrast = 1.0
    vibrancy = 0.2
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = FantasqueSansM Nerd Font Propo
    color = rgba(183, 189, 248, 0.9)
    halign = center
    valign = center
    position = 0, 80
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 20
    font_family = FantasqueSansM Nerd Font Propo
    color = rgba(255, 255, 255, 0.7)
    halign = center
    valign = center
    position = 0, 0
}

input-field {
    monitor =
    font_family = FantasqueSansM Nerd Font Propo
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    outer_color = rgba(110, 115, 141, 0.8)
    inner_color = rgba(54, 58, 79, 0.6)
    font_color = rgb(255, 255, 255)
    fade_on_empty = true
    placeholder_text = <i>password</i>
    fail_text = <b>$FAIL</b>
    halign = center
    valign = center
    position = 0, -120
    check_color = rgba(166, 218, 149, 0.8)
    fail_color = rgba(119, 58, 79, 0.8)
}